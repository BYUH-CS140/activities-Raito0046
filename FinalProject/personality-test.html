<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personality Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Personality Test</h1>
    <p class="catch">Answer a few questions and find out your personality type!</p>
  </header>
  <main>
    <div class="question-box" id="quiz">
      <!-- The quiz will be rendered here by JS -->
    </div>
    <div class="result-area" id="result">
  <div class="result-images">
    <img id="result-img1" src="" alt="Type image 1">
    <img id="result-img2" src="" alt="Type image 2">
  </div>
  <div class="result-info">
    <h2 id="result-type"></h2>
    <div id="result-aliases"></div>
    <p id="result-desc"></p>
    <div class="result-btn-area">
      <a href="personality-test.html" class="btn">Try Again</a>
    </div>
  </div>
</div>
    <section style="text-align:center; margin-top:2em;">
      <a href="index.html" class="btn">Back to Home</a>
    </section>
  </main>
  <script src="main.js"></script>
</body>

</html>
