<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Feedback</h1>
    <p class="catch">We'd love to hear from you!</p>
  </header>
  <nav class="global-nav">
    <a href="index.html">Home</a>
    <a href="mini-game.html">Mini Game</a>
    <a href="about.html">About</a>
    <a href="feedback.html" class="active">Feedback</a>
  </nav>
  <main>
    <form class="feedback-form" id="form">
      <div class="msg" id="msg"></div>
      <label for="name">Name (optional)</label>
      <input type="text" id="name" name="name" maxlength="32">
      <label for="email">Email (optional)</label>
      <input type="email" id="email" name="email" maxlength="64">
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4" required></textarea>
      <label for="rating">Rating</label>
      <select id="rating" name="rating" required>
        <option value="">Please Select</option>
        <option value="5">★★★★★ Excellent</option>
        <option value="4">★★★★☆ Good</option>
        <option value="3">★★★☆☆ Average</option>
        <option value="2">★★☆☆☆ Poor</option>
        <option value="1">★☆☆☆☆ Bad</option>
      </select>
      <button type="submit">Submit</button>
    </form>
    <section style="text-align:center; margin-top:2em;">
      <a href="index.html" class="btn">Back to Home</a>
    </section>
  </main>
  <script src="main.js"></script>
</body>
<footer>
    <p>&copy; 2025 Raito Oshiro Personality Test </p>
  </footer>
</html>
